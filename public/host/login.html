<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host Login · Quiz Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/shared.css">
  <script src="/i18n.js"></script>
  <script src="/lang.js"></script>
</head>
<body class="gradient-bg flex items-center justify-center min-h-screen p-4">

  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">

    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🎮</div>
      <h1 class="text-3xl font-black text-purple-800" data-i18n="login.heading">Quiz Host</h1>
      <p class="text-gray-500 text-sm mt-1" data-i18n="login.tagline">Sign in to manage your quizzes</p>
    </div>

    <form method="POST" action="/host/login" class="space-y-5">
      <div>
        <label for="password" class="block text-sm font-bold text-gray-700 mb-1" data-i18n="login.label_password">
          Host Password
        </label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-800 font-bold
                 focus:outline-none focus:border-purple-500 transition-colors text-lg"
          placeholder="Enter password"
          data-i18n-placeholder="login.placeholder_password"
        >
      </div>

      <div id="error-msg" class="hidden bg-red-50 border-2 border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm font-bold text-center" data-i18n="login.error_wrong_pw">
        Incorrect password — try again
      </div>

      <button type="submit"
        class="w-full bg-purple-700 hover:bg-purple-800 text-white font-black text-lg rounded-xl py-3
               transition-colors cursor-pointer shadow-md hover:shadow-lg"
        data-i18n="login.btn_sign_in">
        Sign In
      </button>
    </form>

  </div>

  <script>
    (async () => {
      try {
        const r = await fetch('/api/settings/public');
        if (r.ok) {
          const s = await r.json();
          window.applyI18n(s.ui_language || 'en');
          document.title = window.t('login.title');
        }
      } catch { /* ignore */ }
    })();
    if (new URLSearchParams(location.search).get('error') === '1') {
      document.getElementById('error-msg').classList.remove('hidden');
    }
  </script>
</body>
</html>
